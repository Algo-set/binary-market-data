[package]
name = "binary-market-data"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Read-only normalized order books for binary markets"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Algo-set/binary-market-data"
publish = false

[lib]
name = "binary_market_data"
path = "src/lib.rs"

[[bin]]
name = "market-data-probe"
path = "src/bin/market-data-probe.rs"

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
urlencoding = "2"
