[build-system]
requires = ["hatchling>=1.27,<2", "editables>=0.5,<1"]
build-backend = "hatchling.build"

[project]
name = "binary-market-data"
version = "0.2.0"
description = "Read-only binary-market books and five-minute prediction feeds"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Algo Set"}]
dependencies = ["httpx>=0.28.1,<1", "websockets>=15,<18"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/Algo-set/binary-market-data"
Issues = "https://github.com/Algo-set/binary-market-data/issues"

[project.scripts]
market-data-probe = "binary_market_data.cli:main"
five-minute-probe = "binary_market_data.five_minute_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "build>=1,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/binary_market_data"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/pyproject.toml", "/README.md", "/LICENSE", "/requirements-dev.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
