name: Python

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        dependencies: [pinned]
        include:
          - python: "3.11"
            dependencies: minimum
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - if: matrix.dependencies == 'minimum'
        run: python -m pip install 'httpx==0.28.1' 'websockets==15.0'
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m pytest

  package:
    name: Python format and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m build --no-isolation
      - run: python -m pip install --no-deps dist/*.whl
      - name: Smoke test installed wheel outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -m binary_market_data --help
          market-data-probe --help
          python "$GITHUB_WORKSPACE/python/examples/offline_book.py"

  parity:
    name: Rust and Python replay parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --locked --example replay_fixture
      - run: python -m pip install -r python/requirements-dev.txt
      - run: python -m pip install --no-deps --no-build-isolation ./python
      - run: python -m pytest python/tests/test_rust_parity.py
        env:
          BINARY_MARKET_DATA_RUST_REPLAY: ${{ github.workspace }}/target/debug/examples/replay_fixture
